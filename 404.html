<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — IronPulse Fitness">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050b1a">
  <title>404 — Page Not Found | Stackly Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/preloader.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-label="Page loading">
    <div class="preloader__inner">
      <img src="assets/stackly-fitness-logo.webp" alt="Stackly Fitness" class="preloader__logo" width="120" height="120" decoding="async">
      <div class="preloader__progress-wrap">
        <div class="preloader__progress-bar" id="preloader-progress-bar" aria-hidden="true"></div>
      </div>
      <span class="preloader__percent" id="preloader-percent" aria-label="Loading progress">0%</span>
    </div>
  </div>

  <main class="error-page" id="main">
    <div class="error-page__glow error-page__glow--1" aria-hidden="true"></div>
    <div class="error-page__glow error-page__glow--2" aria-hidden="true"></div>

    <div class="error-page__inner">
      <article class="error-page__card glass-panel">
        <span class="error-page__code" aria-hidden="true">404</span>
        <h1 class="error-page__title">Page Not Found</h1>
        <p class="error-page__text">
          The page you&rsquo;re looking for doesn&rsquo;t exist or has been moved. Head back to IronPulse and keep training toward your goals.
        </p>
        <div class="error-page__actions">
          <a href="index.html" class="btn btn--primary btn--lg">Back to Home</a>
         
        </div>
      </article>
    </div>
  </main>

  <script src="js/preloader.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
